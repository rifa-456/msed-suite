[build-system]
# grpcio-tools is pinned so the generated protobuf code is reproducible. 1.80.0 bundles
# protoc 31.1, whose Python output runs on protobuf >= 6.31.1 (see dependencies).
requires = ["hatchling>=1.25", "grpcio-tools==1.80.0"]
build-backend = "hatchling.build"

[project]
name = "msed"
version = "1.0.0"
description = "Validate and convert MSED Minecraft recordings (Protobuf shards) to Parquet datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rafael da Silva Santos", email = "raf.silva@aluno.uece.br" }]
requires-python = ">=3.10"
keywords = [
    "minecraft", "dataset", "gameplay-recording", "reinforcement-learning", "imitation-learning",
    "world-models", "embodied-ai", "multimodal", "parquet", "protobuf", "huggingface",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "packaging>=24",
    "protobuf>=6.31.1,<8",
    "pyarrow>=16",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/rifa-456/msed-suite"
Documentation = "https://msed-suite.readthedocs.io"
Paper = "https://doi.org/10.1109/CoG67430.2026.11778848"
Repository = "https://github.com/rifa-456/msed-suite"
Issues = "https://github.com/rifa-456/msed-suite/issues"
Changelog = "https://github.com/rifa-456/msed-suite/blob/main/CHANGELOG.md"

[project.scripts]
msed = "msed.cli:main"

[dependency-groups]
dev = [
    # The build hook's own dependencies, so it can be linted and type-checked.
    "grpcio-tools==1.80.0",
    "hatchling>=1.25",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pydoclint>=0.5",
    "pytest>=8",
    "ruff>=0.6",
    "types-protobuf",
    "types-tqdm",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/msed"]
# Generated at build time and git-ignored, so they must be listed explicitly.
artifacts = ["src/msed/v1/*.py", "src/msed/v1/*.pyi"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "hatch_build.py", "README.md", "LICENSE"]
exclude = ["src/msed/v1"]

[tool.hatch.build.targets.sdist.force-include]
# The schema lives at the repository root; ship a copy so the sdist builds on its own.
"../proto" = "proto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/msed/v1"]

[tool.ruff.lint]
select = ["ALL"]
# D401 asks for imperative summaries, which the Google convention leaves unchecked.
extend-select = ["D401"]
# COM812: conflicts with ruff format.
# CPY001: LICENSE covers every file.
# D105, D107: Python defines what dunder methods mean, and a class docstring documents its
# constructor's arguments.
# EM101, EM102, TRY003: exception messages are written where they are raised.
# PLR0913: it counts keyword-only arguments; PLR0917 limits positional ones.
# S603: no subprocess call here goes through a shell.
ignore = ["COM812", "CPY001", "D105", "D107", "EM101", "EM102", "PLR0913", "S603", "TRY003"]

[tool.ruff.lint.per-file-ignores]
# Tests leave annotations to mypy, which still checks their bodies, take fixtures by name, use
# assert and compare against literal expected values.
"tests/**" = ["ANN", "D", "PLR2004", "S101", "INP001"]
# The build hook is loaded by path, not imported as part of a package.
"hatch_build.py" = ["INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "hatch_build.py"]
mypy_path = ["src"]
strict = true
warn_unreachable = true
enable_error_code = ["deprecated", "exhaustive-match", "ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# Tests leave annotations out (see the ruff ignores) but their bodies are still checked.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# Generated by protoc at build time.
module = ["msed.v1.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Neither ships type information.
module = ["pyarrow", "pyarrow.*", "grpc_tools", "grpc_tools.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "msed"

[[tool.importlinter.contracts]]
# Each layer uses only the layers below it: the dataset is built from validated episodes, and
# validation reads episodes. Every module of the package has to be listed.
name = "Toolkit layers"
type = "layers"
containers = ["msed"]
exhaustive = true
layers = [
    "__main__",
    "cli",
    "_dataset",
    "_validation",
    "_episode",
    "v1 | _version | errors",
]

[tool.pydoclint]
# Types come from the annotations; a one-line docstring needs no sections.
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = true
exclude = "src/msed/v1"

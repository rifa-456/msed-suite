site_name: MSED
site_description: Record Minecraft gameplay as tick-aligned, multi-modal datasets.
# Read the Docs sets the address of the version it builds; pages name it as their canonical one.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://msed-suite.readthedocs.io/en/latest/"]
repo_url: https://github.com/rifa-456/msed-suite
repo_name: rifa-456/msed-suite
edit_uri: edit/main/docs/
copyright: MSED is MIT licensed. Minecraft is a trademark of Mojang Synergies AB.

docs_dir: docs
validation:
  anchors: warn
exclude_docs: |
  hooks/
  overrides/
  requirements.txt

nav:
  - Home: index.md
  - Get started:
      - Your first dataset: tutorial.md
  - Guides:
      - Recording: recording.md
      - Converting and publishing: converting.md
      - Using a dataset: dataset.md
  - Concepts:
      - How MSED records: concepts.md
  - Reference:
      - Tick columns: columns.md
      - Schema: schema.md
      - Settings: settings.md
      - Command line: cli.md
      - Python API: api.md
  - Contributing:
      - Architecture: architecture.md

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/icon.svg
  favicon: assets/icon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light theme
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

hooks:
  - docs/hooks/schema_reference.py
  - docs/hooks/settings_reference.py
  - docs/hooks/versions.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - mkdocs-click
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [toolkit/src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]
